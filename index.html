function todayISO() {
  // data locale (non UTC): evita che dopo mezzanotte UTC risulti il giorno sbagliato
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function addDaysISO(iso, n) {
  const d = new Date(iso + "T00:00:00");
  d.setDate(d.getDate() + n);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

// Legge un elenco incollato di pesate, una per riga: "24.08 72,45kg", "24/08/2026 72.45", ecc.
// Senza anno: si usa l'anno corrente, o il precedente se la data cadrebbe nel futuro.
function parseWeightList(text, todayIso) {
  const out = [];
  let bad = 0;
  String(text || "").split(/\r?\n/).forEach((line) => {
    const l = line.trim();
    if (!l) return;
    const m = l.match(/^(\d{1,2})[.\/-](\d{1,2})(?:[.\/-](\d{2,4}))?\s*[:;,]?\s+(\d{2,3}(?:[.,]\d{1,2})?)\s*(?:kg)?$/i);
    if (!m) { bad++; return; }
    const dd = +m[1], mm = +m[2];
    const kg = parseFloat(m[4].replace(",", "."));
    if (dd < 1 || dd > 31 || mm < 1 || mm > 12 || !(kg >= 20 && kg <= 400)) { bad++; return; }
    let yyyy;
    if (m[3]) yyyy = m[3].length === 2 ? 2000 + +m[3] : +m[3];
    else {
      yyyy = +todayIso.slice(0, 4);
      const tryIso = `${yyyy}-${String(mm).padStart(2, "0")}-${String(dd).padStart(2, "0")}`;
      if (tryIso > todayIso) yyyy -= 1;
    }
    const iso = `${yyyy}-${String(mm).padStart(2, "0")}-${String(dd).padStart(2, "0")}`;
    const chk = new Date(iso + "T00:00:00");
    if (isNaN(chk) || chk.getDate() !== dd) { bad++; return; }
    out.push({ date: iso, kg: Math.round(kg * 100) / 100 });
  });
  return { entries: out, bad };
}

// Aggiorna la libreria esercizi salvata dall'utente con le novità del codice
// (nuovi esercizi, campi variantGroup, ecc.) senza toccare sessioni o personalizzazioni.
function mergeExerciseLibrary(savedExercises) {
  const saved = Array.isArray(savedExercises) ? savedExercises : [];
  const savedIds = new Set(saved.map((e) => e.id));
  const merged = saved.map((ex) => {
    const def = DEFAULT_EXERCISES.find((d) => d.id === ex.id);
    return def ? { ...ex, ...def } : ex; // il codice più recente vince sui metadati di libreria
  });
  DEFAULT_EXERCISES.forEach((def) => {
    if (!savedIds.has(def.id)) merged.push(def); // aggiunge i nuovi esercizi introdotti negli aggiornamenti
  });
  return merged;
}

function loadLocal() {
  try {
    const raw = localStorage.getItem(LOCAL_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      parsed.exercises = mergeExerciseLibrary(parsed.exercises);
      if (parsed.schemaVersion == null) parsed.schemaVersion = SCHEMA_VERSION;
      return parsed;
    }
  } catch (e) {}
  return { schemaVersion: SCHEMA_VERSION, phase: "massa", exercises: DEFAULT_EXERCISES, sessions: DEFAULT_SESSIONS, bodyWeights: [], updatedAt: 0 };
}
function saveLocal(data) {
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify(data)); } catch (e) {}
}

async function driveFindFileId(token) {
  const q = encodeURIComponent(`name='${DRIVE_FILENAME}'`);
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,name)`, {
    headers: { Authorization: `Bearer ${token}` },
  });
  if (!res.ok) throw new Error("drive list failed");
  const json = await res.json();
  return (json.files && json.files[0]) ? json.files[0].id : null;
}

async function driveCreateFile(token, contentStr) {
  const metadata = { name: DRIVE_FILENAME, parents: ["appDataFolder"] };
  const boundary = "gymapp_boundary_xyz";
  const body =
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
    `--${boundary}\r\nContent-Type: application/json\r\n\r\n${contentStr}\r\n--${boundary}--`;
  const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", {
    method: "POST",
    headers: { Authorization: `Bearer ${token}`, "Content-Type": `multipart/related; boundary=${boundary}` },
    body,
  });
  if (!res.ok) throw new Error("drive create failed");
  const json = await res.json();
  return json.id;
}

async function driveUpdateFile(token, fileId, contentStr) {
  const res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
    method: "PATCH",
    headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
    body: contentStr,
  });
  if (!res.ok) throw new Error("drive update failed");
}

async function driveGetContent(token, fileId) {
  const res = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
    headers: { Authorization: `Bearer ${token}` },
  });
  if (!res.ok) throw new Error("drive get failed");
  return await res.text();
}

// Media mobile a 7 giorni di calendario (non 7 pesate): per ogni pesata, media delle pesate negli ultimi 7 giorni.
function movingAvg7(sortedAsc) {
  return sortedAsc.map((p) => {
    const from = addDaysISO(p.date, -6);
    const win = sortedAsc.filter((q) => q.date >= from && q.date <= p.date);
    return { date: p.date, kg: win.reduce((a, q) => a + q.kg, 0) / win.length };
  });
}
// Valore della pesata più recente con data <= iso (null se non c'è).
function valueOnOrBefore(sortedAsc, iso) {
  let v = null;
  sortedAsc.forEach((p) => { if (p.date <= iso) v = p; });
  return v;
}

function WeightChart({ points, avg, t }) {
  const W = 600, H = 240, L = 40, R = 12, T = 12, B = 26;
  if (points.length < 2) {
    return <div style={{ fontSize: 12, color: "#9a978c", padding: "24px 0", textAlign: "center" }}>{t("wNeedMore")}</div>;
  }
  const ms = (iso) => new Date(iso + "T00:00:00").getTime();
  const x0 = ms(points[0].date), x1 = ms(points[points.length - 1].date);
  const all = points.map((p) => p.kg).concat(avg.map((p) => p.kg));
  let lo = Math.min(...all), hi = Math.max(...all);
  if (hi - lo < 1) { const mid = (hi + lo) / 2; lo = mid - 0.5; hi = mid + 0.5; }
  const pad = (hi - lo) * 0.1;
  lo -= pad; hi += pad;
  const sx = (iso) => L + (x1 === x0 ? 0.5 : (ms(iso) - x0) / (x1 - x0)) * (W - L - R);
  const sy = (kg) => T + (1 - (kg - lo) / (hi - lo)) * (H - T - B);
  const ticks = [0, 1, 2, 3].map((i) => lo + ((hi - lo) * i) / 3);
  const path = (arr) => arr.map((p, i) => `${i ? "L" : "M"}${sx(p.date).toFixed(1)},${sy(p.kg).toFixed(1)}`).join(" ");
  const midIdx = Math.floor(points.length / 2);
  const xLabels = [points[0], points[midIdx], points[points.length - 1]].filter((p, i, a) => a.findIndex((q) => q.date === p.date) === i);
  return (
    <div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", height: "auto", display: "block" }} role="img" aria-label="weight chart">
        {ticks.map((v, i) => (
          <g key={i}>
            <line x1={L} x2={W - R} y1={sy(v)} y2={sy(v)} stroke="#26241f" strokeWidth="1" />
            <text x={L - 6} y={sy(v) + 4} textAnchor="end" fontSize="11" fill="#9a978c" fontFamily="monospace">{fmtNum(v, 1)}</text>
          </g>
        ))}
        {xLabels.map((p, i) => (
          <text key={p.date} x={sx(p.date)} y={H - 6} fontSize="11" fill="#9a978c" fontFamily="monospace"
            textAnchor={i === 0 ? "start" : (i === xLabels.length - 1 ? "end" : "middle")}>{fmtShort(p.date)}</text>
        ))}
        <path d={path(points)} fill="none" stroke="#5c5a50" strokeWidth="1.5" />
        {points.map((p) => <circle key={p.date} cx={sx(p.date)} cy={sy(p.kg)} r={points.length > 60 ? 1.8 : 3} fill="#9a978c" />)}
        <path d={path(avg)} fill="none" stroke="#D6E24B" strokeWidth="3" strokeLinejoin="round" strokeLinecap="round" />
      </svg>
      <div style={{ display: "flex", gap: 16, fontSize: 11, color: "#9a978c", marginTop: 4 }}>
        <span style={{ display: "flex", alignItems: "center", gap: 6 }}><span style={{ width: 8, height: 8, borderRadius: "50%", background: "#9a978c", display: "inline-block" }}></span>{t("wDaily")}</span>
        <span style={{ display: "flex", alignItems: "center", gap: 6 }}><span style={{ width: 16, height: 3, borderRadius: 2, background: "#D6E24B", display: "inline-block" }}></span>{t("wAvg")}</span>
      </div>
    </div>
  );
}

/* =========================================================
   APP
   ========================================================= */
function GymAgent() {
  const [data, setData] = useState(() => loadLocal());
  const [tab, setTab] = useState("log");
  const [confirmReset, setConfirmReset] = useState(false);
  const [historyFilter, setHistoryFilter] = useState("");
  const [expandedSession, setExpandedSession] = useState(null);
  const [expandedExercise, setExpandedExercise] = useState(null);
  const [sessionDate, setSessionDate] = useState(todayISO());
  const [pickerOpen, setPickerOpen] = useState(false);
  const [today, setToday] = useState({});
  const [editingId, setEditingId] = useState(null); // sessione in modifica (esclusa da "ultima volta" e note precedenti)
  const [openNotes, setOpenNotes] = useState({}); // quali box "note precedenti" sono espansi
  const [newExOpen, setNewExOpen] = useState(false);
  const [replacingId, setReplacingId] = useState(null); // id esercizio in fase di sostituzione
  const [newExName, setNewExName] = useState("");
  const [newExCategory, setNewExCategory] = useState(CATEGORIES[0]);
  const [newExType, setNewExType] = useState("weight");
  const [newExUnit, setNewExUnit] = useState("kg");

  const [signedIn, setSignedIn] = useState(false);
  const [syncStatus, setSyncStatus] = useState("offline"); // offline | syncing | synced | error
  const [syncNotice, setSyncNotice] = useState(null); // avviso non bloccante (es. dati sovrascritti da Drive)
  const [driveFileId, setDriveFileId] = useState(null);
  const [exportText, setExportText] = useState(null);
  const [importText, setImportText] = useState("");
  const [showImport, setShowImport] = useState(false);
  const [importMsg, setImportMsg] = useState(null);

  // Peso corporeo
  const [wDate, setWDate] = useState(todayISO());
  const [wKg, setWKg] = useState("");
  const [wRange, setWRange] = useState("3m");
  const [wMsg, setWMsg] = useState(null);
  const [wPasteOpen, setWPasteOpen] = useState(false);
  const [wPaste, setWPaste] = useState("");
  const [wPasteMsg, setWPasteMsg] = useState(null);

  // Lingua (per dispositivo)
  const [lang, setLang] = useState(() => { try { return localStorage.getItem(LANG_KEY) || "it"; } catch (e) { return "it"; } });
  LOCALE = lang === "en" ? "en-GB" : "it-IT";
  const t = useMemo(() => makeT(lang), [lang]);
  useEffect(() => { document.documentElement.lang = lang; }, [lang]);
  function changeLang(l) {
    setLang(l);
    try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
  }
  const exName = (ex) => (ex ? (lang === "en" && EXERCISE_EN[ex.id] ? EXERCISE_EN[ex.id] : ex.name) : "");
  const catName = (c) => (lang === "en" ? CATEGORY_EN[c] || c : c);
  const lbl = (s) => (lang === "en" && LABEL_EN[s] ? LABEL_EN[s] : s);

  const dataRef = useRef(data);
  dataRef.current = data;
  const currentSessionIdRef = useRef(null);

  /* --- init Google auth appena lo script GIS è pronto --- */
  useEffect(() => {
    const interval = setInterval(() => {
      if (window.google && window.google.accounts) {
        ensureTokenClient(handleNewToken);
        requestSilentToken(); // tenta login silenzioso se già autorizzato prima
        clearInterval(interval);
      }
    }, 300);
    return () => clearInterval(interval);
  }, []);

  async function handleNewToken(token) {
    setSignedIn(true);
    setSyncStatus("syncing");
    try {
      let fileId = driveFileId || await driveFindFileId(token);
      if (!fileId) {
        // Fix: timbra updatedAt alla creazione, altrimenti (updatedAt=0) un altro
        // device tratterebbe il file remoto come "vecchio" e lo sovrascriverebbe.
        const seed = { ...dataRef.current, schemaVersion: SCHEMA_VERSION, updatedAt: Date.now() };
        fileId = await driveCreateFile(token, JSON.stringify(seed));
        setDriveFileId(fileId);
        setData(seed);
        saveLocal(seed);
        setSyncStatus("synced");
        return;
      }
      setDriveFileId(fileId);
      const remoteStr = await driveGetContent(token, fileId);
      const remote = JSON.parse(remoteStr);
      remote.exercises = mergeExerciseLibrary(remote.exercises);
      const local = dataRef.current;
      // last-write-wins in base a updatedAt
      if ((remote.updatedAt || 0) > (local.updatedAt || 0)) {
        // Se il locale non era "vuoto/default" e viene comunque sostituito, avvisa:
        // con modifiche offline su piu device uno dei due set puo essere perso.
        const localHadEdits = (local.updatedAt || 0) > 0;
        if (localHadEdits) setSyncNotice("overwritten");
        if (remote.schemaVersion == null) remote.schemaVersion = SCHEMA_VERSION;
        setData(remote);
        saveLocal(remote);
      } else if ((local.updatedAt || 0) > (remote.updatedAt || 0)) {
        await driveUpdateFile(token, fileId, JSON.stringify(local));
      }
      setSyncStatus("synced");
    } catch (e) {
      setSyncStatus("error");
    }
  }

  function persist(next) {
    const stamped = { schemaVersion: SCHEMA_VERSION, ...next, updatedAt: Date.now() };
    setData(stamped);
    saveLocal(stamped);
    if (currentToken && driveFileId) {
      setSyncStatus("syncing");
      driveUpdateFile(currentToken, driveFileId, JSON.stringify(stamped))
        .then(() => setSyncStatus("synced"))
        .catch(() => setSyncStatus("error"));
    } else if (signedIn) {
      // token forse scaduto, prova refresh silenzioso
      requestSilentToken();
    }
  }

  const sortedSessions = useMemo(
    () => [...data.sessions].sort((a, b) => new Date(b.date) - new Date(a.date)),
    [data.sessions]
  );
  const exercisesById = useMemo(
    () => Object.fromEntries(data.exercises.map((e) => [e.id, e])),
    [data.exercises]
  );

  // Sessioni "passate" rispetto a quella che si sta compilando (esclude quella in modifica).
  const pastSessions = useMemo(
    () => sortedSessions.filter((s) => s.id !== editingId),
    [sortedSessions, editingId]
  );
  function lastEntryOf(exId) {
    for (const s of pastSessions) {
      const e = s.entries.find((x) => x.exerciseId === exId && (!Array.isArray(x.sets) || x.sets.length > 0));
      if (e) return { date: s.date, entry: e };
    }
    return null;
  }
  function previousNotes(exId) {
    const out = [];
    pastSessions.forEach((s) => {
      s.entries.forEach((e) => {
        if (e.exerciseId === exId && e.note && String(e.note).trim()) out.push({ date: s.date, note: e.note });
      });
    });
    return out;
  }

  // Esercizi già impegnati oggi (come card o come secondo esercizio di un superset)
  const usedToday = useMemo(() => {
    const u = new Set(Object.keys(today));
    Object.values(today).forEach((e) => { if (e && e.mode === "superset" && e.pairId) u.add(e.pairId); });
    return u;
  }, [today]);

  function lastUsedVariantId(groupExercises) {
    let bestId = groupExercises[0].id;
    let bestDate = null;
    groupExercises.forEach((ex) => {
      const found = sortedSessions.find((s) => s.entries.some((e) => e.exerciseId === ex.id));
      if (found && (!bestDate || new Date(found.date) > new Date(bestDate))) {
        bestDate = found.date;
        bestId = ex.id;
      }
    });
    return bestId;
  }

  function buildPickerItems(items) {
    const seen = new Set();
    const out = [];
    items.forEach((ex) => {
      if (ex.variantGroup) {
        if (seen.has(ex.variantGroup)) return;
        seen.add(ex.variantGroup);
        out.push({ type: "group", key: ex.variantGroup, label: ex.groupLabel, exercises: items.filter((e) => e.variantGroup === ex.variantGroup) });
      } else {
        out.push({ type: "single", ex });
      }
    });
    return out;
  }

  const exerciseHistoryRows = useMemo(() => {
    if (!historyFilter) return [];
    return sortedSessions
      .filter((s) => s.entries.some((e) => e.exerciseId === historyFilter))
      .map((s) => ({ date: s.date, entry: s.entries.find((e) => e.exerciseId === historyFilter) }));
  }, [historyFilter, sortedSessions]);

  function getExerciseHistoryRows(exerciseId) {
    return sortedSessions
      .filter((s) => s.entries.some((e) => e.exerciseId === exerciseId))
      .map((s) => ({ date: s.date, entry: s.entries.find((e) => e.exerciseId === exerciseId) }));
  }

  function deleteSession(sessionId) {
    persist({ ...data, sessions: data.sessions.filter((s) => s.id !== sessionId) });
  }

  // Converte le entry salvate di una sessione nelle card di "Oggi".
  // I superset salvati come 2 entry collegate tornano a essere una sola card.
  function entriesToToday(entries, keepNotes) {
    const out = {};
    entries.forEach((entry) => {
      const ex = exercisesById[entry.exerciseId];
      if (!ex) return;
      // seconda metà di un superset: viene fusa nella card del primo esercizio
      if (entry.supersetOf && entries.some((e) => e.exerciseId === entry.supersetOf && e.superset === entry.exerciseId) && exercisesById[entry.supersetOf]) return;
      if (ex.type !== "weight") {
        out[entry.exerciseId] = { note: keepNotes ? entry.note || "" : "" };
        return;
      }
      let mode = entry.drop ? "drop" : null;
      let pairId = null;
      let sets = null;
      if (entry.superset) {
        const partner = entries.find((e) => e.exerciseId === entry.superset);
        if (partner && exercisesById[partner.exerciseId]) {
          mode = "superset";
          pairId = partner.exerciseId;
          const a = entry.sets || [], b = partner.sets || [];
          const n = Math.max(a.length, b.length);
          sets = Array.from({ length: n }, (_, i) => ({
            weight: str(a[i] && a[i].weight), reps: str(a[i] && a[i].reps),
            weight2: str(b[i] && b[i].weight), reps2: str(b[i] && b[i].reps),
          }));
        }
      }
      if (!sets) {
        sets = (entry.sets || []).map((s) => ({ weight: str(s.weight), reps: str(s.reps), weight2: str(s.dropWeight), reps2: str(s.dropReps) }));
      }
      out[entry.exerciseId] = { sets, note: keepNotes ? entry.note || "" : "", mode, pairId };
    });
    return out;
  }

  function duplicateSession(session) {
    currentSessionIdRef.current = null;
    setEditingId(null);
    setToday(entriesToToday(session.entries, false)); // note nuove vuote: le vecchie si vedono in "Note precedenti"
    setOpenNotes({});
    setSessionDate(todayISO());
    setTab("log");
  }

  function editSession(session) {
    // Fix: non cancelliamo piu la sessione qui (evita doppio persist sullo stesso
    // snapshot di `data`). Teniamo l'id: saveSession fara' l'update in-place.
    currentSessionIdRef.current = session.id;
    setEditingId(session.id);
    setToday(entriesToToday(session.entries, true));
    setOpenNotes({});
    setSessionDate(session.date);
    setTab("log");
  }

  function downloadBackup() {
    try {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const d = todayISO();
      a.href = url;
      a.download = `bbgym-backup-${d}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    } catch (e) {
      setExportText(JSON.stringify(data));
    }
  }

  function importFromText() {
    setImportMsg(null);
    try {
      const parsed = JSON.parse(importText.trim());
      if (!parsed || !Array.isArray(parsed.sessions) || !Array.isArray(parsed.exercises)) {
        setImportMsg(t("importInvalid"));
        return;
      }
      parsed.exercises = mergeExerciseLibrary(parsed.exercises);
      persist(parsed);
      setImportMsg(t("importOk", { n: parsed.sessions.length }));
      setImportText("");
      setShowImport(false);
    } catch (e) {
      setImportMsg(t("importUnrecognized"));
    }
  }

  // Nuova card: precompilata con l'ultima volta (se esiste), con promemoria "Ultima volta".
  function newCardFor(ex) {
    const last = lastEntryOf(ex.id);
    if (last) {
      const built = entriesToToday([last.entry], false)[ex.id];
      if (built) return { ...built, showLast: true };
    }
    return ex.type === "weight"
      ? { sets: Array.from({ length: ex.defaultSets || 3 }, () => ({ weight: "", reps: "", weight2: "", reps2: "" })), note: "", mode: null, pairId: null, showLast: true }
      : { note: "", showLast: true };
  }

  function addExerciseToToday(ex) {
    setToday((t0) => ({ ...t0, [ex.id]: newCardFor(ex) }));
    setPickerOpen(false);
  }

  // Sostituisce un esercizio MANTENENDO la sua posizione nella sequenza di oggi.
  // I valori già inseriti (peso/reps/nota) vengono conservati; compare "Ultima volta" del nuovo esercizio.
  function replaceExerciseInToday(oldId, newEx) {
    setToday((t0) => {
      if (!t0[oldId]) return t0;
      if (oldId === newEx.id) return t0;
      if (t0[newEx.id]) return t0; // il nuovo esercizio è già in sessione: non lo duplico
      const oldEntry = t0[oldId];
      const oldEx = exercisesById[oldId];
      let newEntry;
      if (newEx.type === "weight") {
        const kept = oldEx && oldEx.type === "weight" && Array.isArray(oldEntry.sets) && oldEntry.sets.length ? oldEntry.sets : null;
        newEntry = kept
          ? { sets: kept.map((s) => ({ ...s })), note: oldEntry.note || "", mode: oldEntry.mode || null, pairId: oldEntry.pairId === newEx.id ? null : oldEntry.pairId || null, showLast: true }
          : { ...newCardFor(newEx), note: oldEntry.note || "" };
      } else {
        newEntry = { note: oldEntry.note || "", showLast: true };
      }
      // Ricostruisco l'oggetto preservando l'ordine delle chiavi: la card resta al suo posto.
      const next = {};
      Object.keys(t0).forEach((k) => {
        if (k === oldId) next[newEx.id] = newEntry;
        else next[k] = t0[k];
      });
      return next;
    });
    setReplacingId(null);
    setNewExOpen(false);
  }

  function createCustomExercise() {
    const name = newExName.trim();
    if (!name) return;
    const newEx = newExType === "weight"
      ? {
          id: "custom-" + uid(), name, category: newExCategory, type: "weight",
          increment: 1, unit: newExUnit.trim() || "kg",
          rangeMassa: [8, 12], rangeForza: [4, 6], defaultSets: 3,
        }
      : { id: "custom-" + uid(), name, category: newExCategory, type: "other" };
    persist({ ...data, exercises: [...data.exercises, newEx] });
    if (replacingId) replaceExerciseInToday(replacingId, newEx);
    else addExerciseToToday(newEx);
    setNewExName("");
    setNewExType("weight");
    setNewExUnit("kg");
    setNewExOpen(false);
  }

  function removeExerciseFromToday(id) {
    setToday((t0) => { const n = { ...t0 }; delete n[id]; return n; });
  }
  function updateSet(exId, idx, field, val) {
    setToday((t0) => {
      const entry = { ...t0[exId] };
      const sets = entry.sets.slice();
      sets[idx] = { ...sets[idx], [field]: val };
      entry.sets = sets;
      return { ...t0, [exId]: entry };
    });
  }
  function addSetRow(exId) {
    setToday((t0) => { const entry = { ...t0[exId] }; entry.sets = [...entry.sets, { weight: "", reps: "", weight2: "", reps2: "" }]; return { ...t0, [exId]: entry }; });
  }
  function applyFirstToAll(exId) {
    setToday((t0) => {
      const entry = { ...t0[exId] };
      const first = entry.sets[0];
      if (!first || first.weight === "" || first.reps === "") return t0;
      entry.sets = entry.sets.map(() => ({ weight: first.weight, reps: first.reps, weight2: first.weight2 || "", reps2: first.reps2 || "" }));
      return { ...t0, [exId]: entry };
    });
  }
  function removeSetRow(exId, idx) {
    setToday((t0) => { const entry = { ...t0[exId] }; entry.sets = entry.sets.filter((_, i) => i !== idx); return { ...t0, [exId]: entry }; });
  }
  function updateNote(exId, val) {
    setToday((t0) => ({ ...t0, [exId]: { ...t0[exId], note: val } }));
  }
  // Interruttori Drop set / Superset (si escludono a vicenda)
  function toggleMode(exId, m) {
    setToday((t0) => {
      const entry = { ...t0[exId] };
      entry.mode = entry.mode === m ? null : m;
      if (entry.mode !== "superset") entry.pairId = null;
      return { ...t0, [exId]: entry };
    });
  }
  function setPair(exId, pairId) {
    setToday((t0) => ({ ...t0, [exId]: { ...t0[exId], pairId: pairId || null } }));
  }

  function saveSession(final) {
    const ids = Object.keys(today);
    if (ids.length === 0) return;
    const validPair = (w, r) => Number.isFinite(w) && Number.isFinite(r) && r > 0;
    const entries = [];
    ids.forEach((exId) => {
      const ex = exercisesById[exId];
      const entry = today[exId];
      if (!ex) return;
      if (ex.type !== "weight") {
        entries.push({ exerciseId: exId, note: entry.note });
        return;
      }
      // Fix 4: valida i numeri (parseFloat("-") o "1.2.3" -> NaN) e scarta i set invalidi.
      const parsed = entry.sets.map((s) => ({
        weight: parseFloat(s.weight), reps: parseInt(s.reps, 10),
        weight2: parseFloat(s.weight2), reps2: parseInt(s.reps2, 10),
      }));
      if (entry.mode === "drop") {
        entries.push({
          exerciseId: exId, note: entry.note || "", drop: true,
          sets: parsed.filter((s) => validPair(s.weight, s.reps)).map((s) => (
            validPair(s.weight2, s.reps2)
              ? { weight: s.weight, reps: s.reps, dropWeight: s.weight2, dropReps: s.reps2 }
              : { weight: s.weight, reps: s.reps }
          )),
        });
      } else if (entry.mode === "superset" && entry.pairId && exercisesById[entry.pairId] && !today[entry.pairId]) {
        // Salvato come 2 entry collegate: storico e "ultima volta" restano separati per esercizio.
        entries.push({
          exerciseId: exId, note: entry.note || "", superset: entry.pairId,
          sets: parsed.filter((s) => validPair(s.weight, s.reps)).map((s) => ({ weight: s.weight, reps: s.reps })),
        });
        entries.push({
          exerciseId: entry.pairId, note: "", supersetOf: exId,
          sets: parsed.filter((s) => validPair(s.weight2, s.reps2)).map((s) => ({ weight: s.weight2, reps: s.reps2 })),
        });
      } else {
        entries.push({
          exerciseId: exId, note: entry.note || "",
          sets: parsed.filter((s) => validPair(s.weight, s.reps)).map((s) => ({ weight: s.weight, reps: s.reps })),
        });
      }
    });
    // Fix 2: non salvare entry a peso rimaste senza alcun set valido.
    const cleaned = entries.filter((e) => {
      const ex = exercisesById[e.exerciseId];
      return !(ex && ex.type === "weight" && e.sets.length === 0);
    });
    if (cleaned.length === 0) return;
    const existingId = currentSessionIdRef.current;
    let nextSessions;
    if (existingId && data.sessions.some((s) => s.id === existingId)) {
      nextSessions = data.sessions.map((s) => (s.id === existingId ? { id: existingId, date: sessionDate, entries: cleaned } : s));
    } else {
      const newId = uid();
      currentSessionIdRef.current = newId;
      nextSessions = [...data.sessions, { id: newId, date: sessionDate, entries: cleaned }];
    }
    // La sessione appena salvata diventa "quella in modifica": non compare nelle note precedenti.
    setEditingId(currentSessionIdRef.current);
    persist({ ...data, sessions: nextSessions });
    if (final) {
      setToday({});
      setSessionDate(todayISO());
      currentSessionIdRef.current = null;
      setEditingId(null);
      setTab("history");
    }
  }

  /* --- Peso corporeo --- */
  const bodyWeights = useMemo(
    () => [...(data.bodyWeights || [])].sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0)),
    [data.bodyWeights]
  );
  const bodyAvg = useMemo(() => movingAvg7(bodyWeights), [bodyWeights]);
  function onWDateChange(v) {
    setWDate(v);
    const ex = bodyWeights.find((p) => p.date === v);
    setWKg(ex ? String(ex.kg).replace(".", lang === "it" ? "," : ".") : "");
    setWMsg(null);
  }
  function saveWeight() {
    const kg = parseFloat(String(wKg).replace(",", "."));
    if (!Number.isFinite(kg) || kg < 20 || kg > 400 || !wDate) { setWMsg(t("wInvalid")); return; }
    const next = (data.bodyWeights || []).filter((p) => p.date !== wDate).concat([{ date: wDate, kg: Math.round(kg * 100) / 100 }]);
    persist({ ...data, bodyWeights: next });
    setWKg("");
    setWDate(todayISO());
    setWMsg(null);
  }
  function importWeightList() {
    const { entries, bad } = parseWeightList(wPaste, todayISO());
    if (entries.length === 0) { setWPasteMsg(t("wPasteNone")); return; }
    const byDate = {};
    (data.bodyWeights || []).forEach((p) => { byDate[p.date] = p; });
    entries.forEach((p) => { byDate[p.date] = p; }); // l'ultima riga per data vince
    persist({ ...data, bodyWeights: Object.values(byDate) });
    setWPasteMsg(t("wPasteOk", { n: new Set(entries.map((p) => p.date)).size }) + (bad ? " " + t("wPasteBad", { n: bad }) : ""));
    setWPaste("");
    setWPasteOpen(false);
    setWRange("all");
  }
  function deleteWeight(date) {
    persist({ ...data, bodyWeights: (data.bodyWeights || []).filter((p) => p.date !== date) });
  }

  const groupedLibrary = CATEGORIES.map((cat) => ({ cat, items: data.exercises.filter((e) => e.category === cat) }));

  // Picker esercizi riutilizzabile: onPick riceve l'esercizio scelto.
  // Usato sia da "Aggiungi esercizio" sia dalla sostituzione in-place.
  function renderExercisePicker(onPick) {
    return (
                <div style={{ marginTop: 12, background: "#1c1c19", border: "1px solid #26241f", borderRadius: 8, padding: 14 }}>
                  {groupedLibrary.map((g) => (
                    <div key={g.cat} style={{ marginBottom: 10 }}>
                      <div style={{ fontSize: 11, textTransform: "uppercase", color: "#9a978c", marginBottom: 6 }}>{catName(g.cat)}</div>
                      <div style={{ display: "flex", flexWrap: "wrap", gap: 10 }}>
                        {buildPickerItems(g.items).map((item) => {
                          if (item.type === "single") {
                            const ex = item.ex;
                            return (
                              <span key={ex.id} className="ga-chip" onClick={() => onPick(ex)} style={usedToday.has(ex.id) ? { opacity: 0.35, pointerEvents: "none" } : {}}>{exName(ex)}</span>

                              <div style={{ display: "flex", gap: 6 }}>
                                {item.exercises.map((ex) => (
                                  <span
                                    key={ex.id}

                                      ...(usedToday.has(ex.id) ? { opacity: 0.35, pointerEvents: "none" } : {}),
                                      ...(ex.id === lastId ? { borderColor: "#D6E24B", color: "#D6E24B" } : {}),

                      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                        <input className="ga-input" placeholder={t("exNamePh")} value={newExName} onChange={(e) => setNewExName(e.target.value)} />
                        <div style={{ display: "flex", gap: 8 }}>
                          <select className="ga-input" value={newExCategory} onChange={(e) => setNewExCategory(e.target.value)}>

                          </select>
                          <select className="ga-input" value={newExType} onChange={(e) => setNewExType(e.target.value)}>
                            <option value="weight">{t("typeWeight")}</option>
                            <option value="other">{t("typeOther")}</option>
                          </select>
                        </div>
                        {newExType === "weight" && (

                    )}
                  </div>
                </div>
    );
  }

  // Riga "Ultima volta (gg/mm): ..." sotto il nome (solo per esercizi aggiunti/sostituiti a mano)
  function renderLastTime(exId, label) {
    const last = lastEntryOf(exId);
    const text = last ? t("lastTime", { d: fmtShort(last.date), s: fmtSets(last.entry) }) : t("firstTime");
    return (
      <div className="ga-mono" style={{ fontSize: 11, color: "#9a978c", marginTop: 4 }}>
        {label ? <span style={{ color: "#7FC4E8" }}>{label} · </span> : null}{text}
      </div>
    );
  }

  // Box "Note precedenti" in sola lettura
  function renderPrevNotes(exId, key, title) {
    const notes = previousNotes(exId);
    if (notes.length === 0) return null;
    const open = !!openNotes[key];
    const shown = open ? notes.slice(0, 10) : notes.slice(0, 2);
    const hidden = Math.min(notes.length, 10) - 2;
    return (
      <div style={{ marginTop: 10, borderLeft: "3px solid #D6E24B", background: "#22211c", borderRadius: "0 6px 6px 0", padding: "8px 10px", fontSize: 12 }}>
        <div style={{ color: "#D6E24B", fontWeight: 600, marginBottom: 4, display: "flex", justifyContent: "space-between", gap: 8 }}>
          <span>{t("prevNotes")}</span>
          {title && <span style={{ color: "#9a978c", fontWeight: 400, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{title}</span>}
        </div>
        {shown.map((n, i) => (
          <div key={i} style={{ color: "#c9c6ba", marginTop: 3 }}>
            <span className="ga-mono" style={{ color: "#9a978c", marginRight: 6 }}>{fmtShort(n.date)}</span>{n.note}
          </div>
        ))}
        {hidden > 0 && (
          <span style={{ color: "#7FC4E8", cursor: "pointer", marginTop: 4, display: "inline-block" }}
            onClick={() => setOpenNotes((o) => ({ ...o, [key]: !open }))}>
            {open ? t("hide") : t("showMore", { n: hidden })}
          </span>
        )}
      </div>
    );
  }

  function renderToggle(on, label, color, onClick) {
    return (
      <div onClick={onClick} style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 12, color: on ? color : "#c9c6ba", cursor: "pointer", userSelect: "none" }}>
        <div style={{ width: 34, height: 18, borderRadius: 9, background: on ? color : "#33312a", position: "relative", transition: "background .2s" }}>
          <div style={{ position: "absolute", top: 2, left: on ? 18 : 2, width: 14, height: 14, borderRadius: "50%", background: on ? "#121210" : "#9a978c", transition: "left .2s" }}></div>
        </div>
        {label}
      </div>
    );
  }

  const syncLabel = {
    offline: t("syncOffline"),
    syncing: t("syncSyncing"),
    synced: t("syncSynced"),
    error: t("syncError"),
  }[syncStatus];
  const syncColor = { offline: "#9a978c", syncing: "#D6E24B", synced: "#7FBF7F", error: "#E2572B" }[syncStatus];

  const DROP_COLOR = "#E8A27F", SS_COLOR = "#7FC4E8";

  // Dati del grafico peso secondo il periodo scelto
  const wCutoff = wRange === "1m" ? addDaysISO(todayISO(), -30) : wRange === "3m" ? addDaysISO(todayISO(), -90) : "0000-00-00";
  const wPoints = bodyWeights.filter((p) => p.date >= wCutoff);
  const wAvgPoints = bodyAvg.filter((p) => p.date >= wCutoff);
  const wLast = bodyWeights[bodyWeights.length - 1];
  function wDelta(days) {
    if (!wLast) return null;
    const ref = valueOnOrBefore(bodyWeights, addDaysISO(wLast.date, -days));
    return ref ? wLast.kg - ref.kg : null;
  }
  const fmtDelta = (d) => (d == null ? "—" : `${d > 0.004 ? "+" : d < -0.004 ? "−" : "±"}${fmtKg(Math.abs(d))}`);

        .ga-input { background:#1c1c19; border:1px solid #33312a; color:#EDEAE0; border-radius:6px; padding:6px 8px; font-family: monospace; font-size:14px; width:100%; box-sizing:border-box; min-width:0; }
        .ga-input:focus { outline:none; border-color:#D6E24B; }
        .ga-btn { background:transparent; border:1px solid #33312a; color:#EDEAE0; border-radius:6px; padding:8px 14px; cursor:pointer; font-size:14px; display:inline-flex; align-items:center; gap:6px; }
        .ga-btn:hover { border-color:#D6E24B; background:#1c1c19; }
        .ga-btn-accent { background:#D6E24B; color:#1a1a12; border-color:#D6E24B; font-weight:600; }
        .ga-chip { border:1px solid #33312a; border-radius:999px; padding:5px 12px; font-size:13px; cursor:pointer; display:inline-flex; align-items:center; gap:4px; background:#1c1c19; }
        .ga-chip:hover { border-color:#D6E24B; }
        .ga-tab { background:transparent; border:none; color:#9a978c; padding:10px 12px; cursor:pointer; display:flex; align-items:center; gap:6px; font-size:13px; border-bottom:2px solid transparent; white-space:nowrap; }
        .ga-tab.active { color:#D6E24B; border-bottom:2px solid #D6E24B; }
        .ga-dual .ga-input { padding:6px 5px; }
        .ga-stat { flex:1; min-width:0; background:#1c1c19; border:1px solid #26241f; border-radius:8px; padding:10px; }
      `}</style>

      <div style={{ padding: "20px 20px 0 20px", display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 8 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <span style={{ fontSize: 24, fontWeight: 700, letterSpacing: "0.02em" }}>🏋️ BACK TO BACK GYM</span>
        </div>
        <span style={{ fontSize: 11, color: syncColor, display: "flex", alignItems: "center", gap: 6 }}>

                  {ex.type === "weight" ? (

                      <div className={dual ? "ga-dual" : ""}>

                        {entry.sets.map((s, i) => (

                  {mode === "superset" && pairEx && renderPrevNotes(pairEx.id, exId + "|" + pairEx.id, exName(pairEx))}
                </div>

            })}

            {Object.keys(today).length > 0 && (
              <div style={{ display: "flex", gap: 8, marginTop: 8, flexWrap: "wrap" }}>
                <button className="ga-btn" onClick={() => saveSession(false)}>{t("savePartial")}</button>
                <button className="ga-btn ga-btn-accent" onClick={() => saveSession(true)}>{t("saveFinal")}</button>
              </div>

        {tab === "history" && (
          <div>
            <div style={{ marginBottom: 16 }}>
              <span style={{ fontSize: 13, color: "#9a978c", marginRight: 8 }}>{t("seeTrend")}</span>
              <select className="ga-input" style={{ width: 260, display: "inline-block" }} value={historyFilter} onChange={(e) => setHistoryFilter(e.target.value)}>

            {historyFilter ? (
              <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 13 }}>

              </label>
              <button className="ga-btn ga-btn-accent" onClick={saveWeight}>
                {bodyWeights.some((p) => p.date === wDate) ? t("wUpdate") : t("wSave")}
              </button>
            </div>
            {wMsg && <div style={{ fontSize: 12, color: "#E2572B", marginBottom: 6 }}>{wMsg}</div>}
            <div style={{ margin: "8px 0 4px" }}>
              {!wPasteOpen ? (
                <span style={{ fontSize: 12, color: "#7FC4E8", cursor: "pointer" }} onClick={() => { setWPasteOpen(true); setWPasteMsg(null); }}>{t("wPasteOpen")}</span>
              ) : (
                <div>
                  <textarea className="ga-input" rows={6} placeholder={t("wPastePh")} value={wPaste} onChange={(e) => setWPaste(e.target.value)} />
                  <div style={{ fontSize: 11, color: "#9a978c", margin: "4px 0 6px" }}>{t("wPasteInfo")}</div>
                  <div style={{ display: "flex", gap: 8 }}>
                    <button className="ga-btn ga-btn-accent" style={{ fontSize: 13 }} onClick={importWeightList}>{t("wPasteBtn")}</button>
                    <button className="ga-btn" style={{ fontSize: 13 }} onClick={() => { setWPasteOpen(false); setWPaste(""); }}>{t("cancel")}</button>
                  </div>
                </div>
              )}
              {wPasteMsg && <div style={{ fontSize: 12, color: "#7FBF7F", marginTop: 6 }}>{wPasteMsg}</div>}
            </div>

            {bodyWeights.length === 0 ? (
              <div style={{ color: "#9a978c", fontSize: 14, padding: "24px 0" }}>{t("wEmpty")}</div>
            ) : (
              <div>
                <div style={{ display: "flex", gap: 8, margin: "16px 0" }}>
                  <div className="ga-stat">
                    <div style={{ fontSize: 11, color: "#9a978c" }}>{t("wCurrent")}</div>
                    <div className="ga-mono" style={{ fontSize: 20, fontWeight: 600 }}>{fmtKg(wLast.kg)}</div>
                    <div style={{ fontSize: 10, color: "#9a978c" }}>{fmtShort(wLast.date)}</div>
                  </div>
                  <div className="ga-stat">
                    <div style={{ fontSize: 11, color: "#9a978c" }}>{t("wAvg")}</div>
                    <div className="ga-mono" style={{ fontSize: 20, fontWeight: 600, color: "#D6E24B" }}>{fmtNum(bodyAvg[bodyAvg.length - 1].kg, 1)}</div>
                  </div>
                  <div className="ga-stat">
                    <div style={{ fontSize: 11, color: "#9a978c" }}>{t("w7")}</div>
                    <div className="ga-mono" style={{ fontSize: 16, fontWeight: 600 }}>{fmtDelta(wDelta(7))}</div>
                    <div style={{ fontSize: 11, color: "#9a978c", marginTop: 4 }}>{t("w30")}</div>
                    <div className="ga-mono" style={{ fontSize: 14 }}>{fmtDelta(wDelta(30))}</div>
                  </div>
                </div>

                <div style={{ background: "#1c1c19", border: "1px solid #26241f", borderRadius: 10, padding: 12 }}>
                  <div style={{ display: "flex", gap: 6, marginBottom: 8 }}>
                    {[["1m", t("r1m")], ["3m", t("r3m")], ["all", t("rAll")]].map(([k, l]) => (
                      <button key={k} className={`ga-btn ${wRange === k ? "ga-btn-accent" : ""}`} style={{ fontSize: 12, padding: "4px 10px" }} onClick={() => setWRange(k)}>{l}</button>
                    ))}
                  </div>
                  {wPoints.length === 0
                    ? <div style={{ fontSize: 12, color: "#9a978c", padding: "24px 0", textAlign: "center" }}>{t("wNoData")}</div>
                    : <WeightChart points={wPoints} avg={wAvgPoints} t={t} />}
                </div>

                <div style={{ fontSize: 13, color: "#9a978c", margin: "18px 0 6px" }}>{t("wList")}</div>
                {[...bodyWeights].reverse().slice(0, 60).map((p) => (
                  <div key={p.date} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "6px 0", borderBottom: "1px solid #1c1c19", fontSize: 13 }}>
                    <span className="ga-mono" style={{ cursor: "pointer" }} onClick={() => onWDateChange(p.date)}>{fmtDate(p.date)}</span>
                    <span style={{ display: "flex", alignItems: "center", gap: 10 }}>
                      <span className="ga-mono" style={{ cursor: "pointer" }} onClick={() => onWDateChange(p.date)}>{fmtKg(p.kg)} kg</span>
                      <button className="ga-btn" style={{ padding: "3px 6px", fontSize: 12 }} onClick={() => deleteWeight(p.date)}>🗑</button>
                    </span>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {tab === "library" && (
          <div>
            {groupedLibrary.map((g) => (
              <div key={g.cat} style={{ marginBottom: 18 }}>
                <div style={{ fontSize: 12, textTransform: "uppercase", color: "#9a978c", marginBottom: 8 }}>{catName(g.cat)}</div>
                {g.items.map((ex) => {
                  const isOpen = expandedExercise === ex.id;
                  const rows = isOpen ? getExerciseHistoryRows(ex.id) : [];
                  return (
                    <div key={ex.id} style={{ borderBottom: "1px solid #1c1c19" }}>
                      <div onClick={() => setExpandedExercise(isOpen ? null : ex.id)} style={{ display: "flex", justifyContent: "space-between", padding: "8px 0", fontSize: 13, cursor: "pointer", gap: 8 }}>
                        <span>{exName(ex)}</span>
                        <span className="ga-mono" style={{ color: "#9a978c", whiteSpace: "nowrap" }}>
                          {ex.type === "weight" ? lbl(ex.unit) : t("free")} {isOpen ? "▲" : "▼"}
                        </span>
                      </div>
                      {isOpen && (
                        <div style={{ padding: "4px 0 12px 0" }}>
                          {rows.length === 0 ? <div style={{ fontSize: 12, color: "#9a978c" }}>{t("noHistory")}</div> : (
                            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
                              <tbody>
                                {rows.map((r, i) => (
                                  <tr key={i} style={{ borderTop: "1px solid #26241f" }}>
                                    <td style={{ padding: "4px 4px" }} className="ga-mono">{fmtDate(r.date)}</td>
                                    <td style={{ padding: "4px 4px" }} className="ga-mono">{fmtSets(r.entry)}</td>
                                    <td></td>
                                  </tr>
                                ))}
                              </tbody>
                            </table>
                          )}
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            ))}
          </div>
        )}

        {tab === "settings" && (
          <div>
            <div style={{ marginBottom: 24 }}>
              <div style={{ fontSize: 13, color: "#9a978c", marginBottom: 8 }}>{t("driveTitle")}</div>
              {!signedIn ? (
                <button className="ga-btn ga-btn-accent" onClick={requestSignIn}>{t("signIn")}</button>
              ) : (
                <div style={{ fontSize: 13, color: syncColor }}>● {syncLabel}</div>
              )}
              <div style={{ fontSize: 12, color: "#9a978c", marginTop: 6 }}>{t("driveInfo")}</div>
              {syncNotice && (
                <div style={{ marginTop: 10, fontSize: 12, color: "#121210", background: "#D6E24B", borderRadius: 6, padding: "8px 10px", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 }}>
                  <span>⚠️ {t("syncNoticeOverwritten")}</span>
                  <button className="ga-btn" style={{ fontSize: 11, padding: "3px 8px", borderColor: "#121210", color: "#121210" }} onClick={() => setSyncNotice(null)}>OK</button>
                </div>
              )}
            </div>

            <div style={{ marginBottom: 24 }}>
              <div style={{ fontSize: 13, color: "#9a978c", marginBottom: 8 }}>{t("languageTitle")}</div>
              <div style={{ display: "flex", gap: 8 }}>
                <button className={`ga-btn ${lang === "it" ? "ga-btn-accent" : ""}`} onClick={() => changeLang("it")}>🇮🇹 Italiano</button>
                <button className={`ga-btn ${lang === "en" ? "ga-btn-accent" : ""}`} onClick={() => changeLang("en")}>🇬🇧 English</button>
              </div>
              <div style={{ fontSize: 12, color: "#9a978c", marginTop: 6 }}>{t("languageInfo")}</div>
            </div>

            <div style={{ marginBottom: 20 }}>
              <div style={{ fontSize: 13, color: "#9a978c", marginBottom: 8 }}>{t("backupTitle")}</div>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                <button className="ga-btn" onClick={downloadBackup}>{t("exportBackup")}</button>
                <button className="ga-btn" onClick={() => { setShowImport(true); setExportText(null); setImportMsg(null); }}>{t("importData")}</button>
              </div>
              {exportText && (
                <div style={{ marginTop: 10 }}>
                  <textarea className="ga-input" readOnly value={exportText} rows={5} style={{ fontSize: 11 }} onFocus={(e) => e.target.select()} />
                </div>
              )}
              {showImport && (
                <div style={{ marginTop: 10 }}>
                  <input type="file" accept="application/json,.json" style={{ marginBottom: 8, display: "block", fontSize: 12 }}
                    onChange={(e) => {
                      const f = e.target.files && e.target.files[0];
                      if (!f) return;
                      const r = new FileReader();
                      r.onload = () => setImportText(String(r.result || ""));
                      r.readAsText(f);
                    }} />
                  <textarea className="ga-input" placeholder={t("importPh")} value={importText} onChange={(e) => setImportText(e.target.value)} rows={5} style={{ fontSize: 11 }} />
                  <div style={{ marginTop: 6, fontSize: 12, color: "#E2572B" }}>{t("importWarn")}</div>
                  <button className="ga-btn ga-btn-accent" style={{ marginTop: 8 }} onClick={importFromText}>{t("importConfirm")}</button>
                </div>
              )}
              {importMsg && <div style={{ marginTop: 8, fontSize: 12 }}>{importMsg}</div>}
            </div>

            <div>
              <div style={{ fontSize: 13, color: "#9a978c", marginBottom: 8 }}>{t("dataTitle")}</div>
              {!confirmReset ? (
                <button className="ga-btn" onClick={() => setConfirmReset(true)}>{t("resetAll")}</button>
              ) : (
                <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
                  <span style={{ fontSize: 13, color: "#E2572B" }}>{t("resetMsg")}</span>
                  <button className="ga-btn" style={{ borderColor: "#E2572B", color: "#E2572B" }} onClick={() => { persist({ schemaVersion: SCHEMA_VERSION, phase: data.phase || "massa", exercises: DEFAULT_EXERCISES, sessions: [], bodyWeights: [] }); setConfirmReset(false); }}>{t("confirm")}</button>
                  <button className="ga-btn" onClick={() => setConfirmReset(false)}>{t("cancel")}</button>
                </div>
              )}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<GymAgent />);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
