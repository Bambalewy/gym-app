<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#121210" />
<title>Back to Back Gym</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<style>
  html, body { margin: 0; padding: 0; background: #121210; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<!-- React servito in locale (offline reale, niente dipendenza da unpkg) -->
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>

<!-- Google Identity Services (login + token OAuth) -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<!-- L'app: app.js è generato da app.jsx (vedi "Aggiorna app.bat"), già tradotto: niente Babel sul telefono -->
<script src="app.js" defer></script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
